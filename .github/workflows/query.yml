name: githubDB query

on:
  repository_dispatch:
    types: [query]

# No concurrency group: GitHub cancels queued runs in a group (1 running + 1
# pending max), which silently drops queries. Instead, runs execute in parallel
# and serialize through git: on push conflict the engine re-executes against
# freshly pulled data (see retry loop below).
permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: githubdb-model-multilingual-e5-small

      - name: Install engine
        run: npm ci --prefix engine

      - name: Execute query and push (retry on race)
        env:
          GITHUBDB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GITHUBDB_MODEL_CACHE: ${{ github.workspace }}/.model-cache
          QUERY_ID: ${{ github.event.client_payload.id }}
        run: |
          git config user.name "githubDB"
          git config user.email "githubdb@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            node engine/run-query.js
            git add data results
            if git diff --cached --quiet; then
              echo "No changes to commit"; exit 0
            fi
            git commit -m "githubDB query $QUERY_ID"
            if git push; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); re-executing"
            git reset --hard HEAD~1
            sleep $(( RANDOM % 5 + attempt ))
            git pull --rebase origin ${{ github.event.repository.default_branch }}
          done
          echo "Failed after 5 attempts" >&2
          exit 1
