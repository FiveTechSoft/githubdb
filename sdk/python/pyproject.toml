[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "githubdb-sdk"
version = "0.1.0"
description = "Python read SDK for githubDB"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
embed = ["sentence-transformers"]

[tool.setuptools.packages.find]
where = ["."]
include = ["githubdb_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
